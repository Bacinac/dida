[project]
name = "dida-adapter-announce"
version = "0.1.0"
description = "DIDA announce adapter — spoken TTS announcements on a Cast speaker (no Home Assistant)"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_announce"]
