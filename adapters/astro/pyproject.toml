[project]
name = "dida-adapter-astro"
version = "0.1.0"
description = "DIDA astro adapter — sun position (elevation) source for the home's location"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "asyncpg",
    "astral>=3.2",
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_astro"]
