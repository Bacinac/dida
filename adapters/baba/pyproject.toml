[project]
name = "dida-adapter-baba"
version = "0.1.0"
description = "DIDA BABA adapter — subscribes BABA's semantic event bus (baba.events.*) and translates vision detections into DIDA capabilities; registers cameras as entities carrying a go2rtc stream descriptor."
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "nats-py",
    "aiohttp>=3.10",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_baba"]
