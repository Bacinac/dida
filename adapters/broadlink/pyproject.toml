[project]
name = "dida-adapter-broadlink"
version = "0.1.0"
description = "DIDA Broadlink adapter — IR/RF remote sender (RM series) over the local protocol"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "broadlink>=0.19",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_broadlink"]
