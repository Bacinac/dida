[project]
name = "dida-adapter-cast"
version = "0.1.0"
description = "DIDA Google Cast adapter — Chromecast / Android TV / Nest via pychromecast (now-playing + control)"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    # The Cast (CASTV2) client Home Assistant uses: mDNS discovery, media
    # status (now-playing) and control. Pure-Python (+ protobuf/zeroconf).
    "PyChromecast>=14",
    # Reads the wall-panel config + token from Postgres (via dida_core.pg_pool).
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_cast"]
