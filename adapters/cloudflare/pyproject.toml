[project]
name = "dida-adapter-cloudflare"
version = "0.1.0"
description = "DIDA ingress adapter — edit the ingress this installation carries: a host-applied services.conf, or the connectors' own config.yml"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "asyncpg",
    # ruamel: round-trip config.yml in cloudflared's own style (tunnel mode).
    "ruamel.yaml",
    # httpx: the Cloudflare API (tunnel provisioning + DNS records), async.
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_cloudflare"]
