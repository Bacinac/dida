[project]
name = "dida-adapter-contacts"
version = "0.1.0"
description = "DIDA contacts adapter — the household address book (Google People API) and whose birthday it is"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "asyncpg",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_contacts"]
