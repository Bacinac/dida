[project]
name = "dida-adapter-denon"
version = "0.1.0"
description = "DIDA Denon/Marantz AVR adapter — Telnet control (port 23): power, volume, mute, source, per zone"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    # The Denon/Marantz Telnet protocol is a trivial line-based ASCII protocol we
    # speak directly over asyncio streams; asyncpg is only for UI-config (DB).
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_denon"]
