[project]
name = "dida-adapter-dlna"
version = "0.1.0"
description = "DIDA DLNA/UPnP adapter — discovers MediaRenderers (DMR) and drives them as media-player entities"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    # The UPnP/DLNA stack Home Assistant itself uses: pure-Python, async,
    # handles SSDP, the device factory, and the DMR profile (AVTransport +
    # RenderingControl) for us. No device-specific code needed.
    "async-upnp-client>=0.43",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_dlna"]
