[project]
name = "dida-adapter-dreame"
version = "0.1.0"
description = "DIDA Dreame adapter — Dreamehome-registered robot vacuum over the Dreame cloud"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "asyncpg",
    # Their cloud pushes the live map frames over MQTT — position, track and the
    # area being cleaned — none of which the saved map file carries.
    "aiomqtt>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_dreame"]
