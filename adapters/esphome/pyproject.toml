[project]
name = "dida-adapter-esphome"
version = "0.1.0"
description = "DIDA ESPHome adapter — native API (port 6053), direct to nodes"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "aioesphomeapi>=30",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_esphome"]
