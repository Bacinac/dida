[project]
name = "dida-adapter-govee"
version = "0.1.0"
description = "DIDA govee adapter — connection form + lifecycle manager for the co-located govee2mqtt bridge"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "aiohttp>=3.10",
    "aiomqtt>=2.0",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_govee"]
