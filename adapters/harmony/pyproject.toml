[project]
name = "dida-adapter-harmony"
version = "0.1.0"
description = "DIDA Harmony adapter — Logitech Harmony Hub over its local API (aioharmony)"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "aioharmony>=0.2.10",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_harmony"]
