[project]
name = "dida-adapter-heos"
version = "0.1.0"
description = "DIDA HEOS adapter — Denon/Marantz players via the HEOS CLI (TCP 1255): the real control plane for volume/transport/sources"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    # pyheos: the HEOS CLI client Home Assistant uses. Handles the line protocol,
    # command/response correlation, reconnect, and async event push for us.
    "pyheos>=1.0",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_heos"]
