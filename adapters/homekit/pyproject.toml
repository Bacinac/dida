[project]
name = "dida-adapter-homekit"
version = "0.1.0"
description = "DIDA HomeKit adapter — HAP-IP accessories via aiohomekit"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "aiohomekit>=4.0.1",  # IP transport is core now; the old [IP] extra is gone
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_homekit"]
