[project]
name = "dida-adapter-iammeter"
version = "0.1.0"
description = "DIDA IAMMETER grid energy-meter adapter — polls the WEM3080's local /monitorjson (read-only)"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "aiohttp>=3.10",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_iammeter"]
