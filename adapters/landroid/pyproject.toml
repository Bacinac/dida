[project]
name = "dida-adapter-landroid"
version = "0.1.0"
description = "DIDA Landroid adapter — Worx Landroid robotic mower via the Worx cloud (pyworxcloud)"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "pyworxcloud>=4.0",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_landroid"]
