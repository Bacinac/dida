[project]
name = "dida-adapter-midea"
version = "0.1.0"
description = "DIDA Midea adapter — Midea AC over the local LAN protocol (msmart-ng)"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "msmart-ng>=2024.0.0",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_midea"]
