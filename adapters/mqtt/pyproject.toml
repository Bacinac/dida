[project]
name = "dida-adapter-mqtt"
version = "0.1.0"
description = "DIDA MQTT adapter — bridges zigbee2mqtt / zwave-js style brokers"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "aiomqtt>=2.3",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_mqtt"]
