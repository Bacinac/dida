[project]
name = "dida-adapter-notify"
version = "0.1.0"
description = "DIDA notify adapter — push notifications via ntfy and Web Push to the DIDA PWA"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "aiohttp>=3.10",
    "asyncpg",
    "pywebpush>=2.0",
    "cryptography>=49",  # FCM v1 OAuth: RS256-sign the service-account JWT
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_notify"]
