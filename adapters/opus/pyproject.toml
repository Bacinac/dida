[project]
name = "dida-adapter-opus"
version = "0.1.0"
description = "DIDA OPUS adapter — the OPUS TV screen as a media player, driven through OPUS · Player"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "aiohttp>=3.10",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_opus"]
