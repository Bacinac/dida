[project]
name = "dida-adapter-peer"
version = "0.1.0"
description = "DIDA peer adapter — mirrors a curated set of another DIDA installation's entities (read-only)"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "aiohttp>=3.10",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_peer"]
