[project]
name = "dida-adapter-presence"
version = "0.1.0"
description = "DIDA presence adapter — OwnTracks GPS → zone resolution → presence:* entities"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "aiomqtt>=2.3",
    "asyncpg>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_presence"]
