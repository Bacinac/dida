[project]
name = "dida-adapter-roidmi"
version = "0.1.0"
description = "DIDA Roidmi adapter — Xiaomi-ecosystem robot vacuum over the local miio (MiOT) protocol"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "asyncpg",
    # cryptography: AES-CBC for the miio payload encryption. Already in dida/base
    # (Fernet), declared here so the package is self-contained.
    "cryptography",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_roidmi"]
