[project]
name = "dida-adapter-samsungtv"
version = "0.1.0"
description = "DIDA Samsung TV adapter — power over the TV's local REST + remote-control websocket, wake-on-LAN to turn on"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "asyncpg",
    "aiohttp",
    "samsungtvws[async]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_samsungtv"]
