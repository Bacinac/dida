[project]
name = "dida-adapter-shelly"
version = "0.1.0"
description = "DIDA Shelly adapter — Gen2+ local RPC (HTTP + WebSocket push)"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "aiohttp>=3.10",
    "asyncpg",
    "zeroconf>=0.130",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_shelly"]
