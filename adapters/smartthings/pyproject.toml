[project]
name = "dida-adapter-smartthings"
version = "0.1.0"
description = "DIDA SmartThings adapter — Samsung appliances/AV via the SmartThings cloud (OAuth)"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "pysmartthings>=3.5",
    "aiohttp>=3.10",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_smartthings"]
