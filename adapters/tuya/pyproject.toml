[project]
name = "dida-adapter-tuya"
version = "0.1.0"
description = "DIDA Tuya adapter — local protocol via tinytuya"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "tinytuya>=1.15",
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_tuya"]
