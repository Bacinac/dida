[project]
name = "dida-adapter-virtual"
version = "0.1.0"
description = "DIDA virtual adapter — DIDA-owned 'helper' entities (boolean/enum/number)"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "asyncpg>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_virtual"]
