[project]
name = "dida-adapter-volumio"
version = "0.1.0"
description = "DIDA Volumio adapter — drives the iFi Zen Stream via its native Volumio REST API (state, control, cast, config)"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    # aiohttp: the async HTTP client for Volumio's REST API. Already in dida/base,
    # declared here so the package is self-contained.
    "aiohttp",
    "asyncpg",
    # asyncssh: reboot/restart the Zen (Volumio REST doesn't cover system actions).
    "asyncssh",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_adapter_volumio"]
