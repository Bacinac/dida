<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1500 950">
  <title>DIDA, BABA and OPUS — exact logo glyphs used as browser icons</title>
  <desc>The first glyph of each accepted wordmark is reused without optical redesign at 32 and 16 pixels.</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#08171c" flood-opacity=".12"/></filter>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="96" height="96"><rect width="96" height="96" fill="#fff"/><path d="M55 4h15L53 38H38Z" fill="#000"/></mask>

    <g id="D" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v70h18c25 0 39-13 39-35S61 13 36 13H18"/></g>
    <g id="B" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v70M18 13h23c19 0 29 6 29 17s-10 18-29 18H18M41 48c22 0 33 6 33 17s-11 18-33 18H18"/></g>
    <g id="O" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="48" cy="48" rx="31" ry="35"/></g>
    <g id="D-cut" mask="url(#cut)"><use xlink:href="#D"/></g>
    <g id="B-cut" mask="url(#cut)"><use xlink:href="#B"/></g>
    <g id="O-cut" mask="url(#cut)"><use xlink:href="#O"/></g>
    <g id="I" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"><path d="M8 13h28M22 13v70M8 83h28"/></g>
    <g id="A" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M8 83 36 13l28 70M19 58h34"/></g>
    <g id="P" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M18 83V13h24c20 0 31 7 31 20S62 53 42 53H18"/></g>
    <g id="U" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M14 13v42c0 19 12 29 29 29s29-10 29-29V13"/></g>
    <g id="S" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M70 22c-7-6-16-9-26-9-18 0-29 8-29 19 0 27 57 12 57 35 0 11-12 17-29 17-12 0-23-4-31-11"/></g>
    <g id="DIDA"><use xlink:href="#D-cut"/><use xlink:href="#I" transform="translate(86)"/><use xlink:href="#D" transform="translate(138)"/><use xlink:href="#A" transform="translate(224)"/></g>
    <g id="BABA"><use xlink:href="#B-cut"/><use xlink:href="#A" transform="translate(88)"/><use xlink:href="#B" transform="translate(168)"/><use xlink:href="#A" transform="translate(256)"/></g>
    <g id="OPUS"><use xlink:href="#O-cut"/><use xlink:href="#P" transform="translate(92)"/><use xlink:href="#U" transform="translate(180)"/><use xlink:href="#S" transform="translate(270)"/></g>
  </defs>

  <rect width="1500" height="950" fill="#f4f7f7"/>
  <circle cx="1420" cy="10" r="270" fill="#dcf3ef"/>
  <circle cx="20" cy="930" r="250" fill="#def1f6"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="90" y="80" font-size="18" font-weight="750" letter-spacing="3" fill="#587178">EXACT LOGO GLYPH · SET 17</text>
    <text x="90" y="136" font-size="40" font-weight="670" fill="#14282e">Isto slovo iz logotipa, bez precrtavanja</text>
    <text x="90" y="174" font-size="18" fill="#687d82">Isti potez · isti rez · iste proporcije — samo smanjeno za browser.</text>

    <text x="90" y="230" font-size="15" font-weight="750" letter-spacing="2.2" fill="#788c91">IZVORNI PUNI LOGOTIPI</text>
    <g transform="translate(90 255)" filter="url(#shadow)">
      <rect width="1320" height="175" rx="28" fill="#fff"/>
      <g transform="translate(70 43) scale(.82)" color="#0e9db5"><use xlink:href="#DIDA"/></g>
      <g transform="translate(480 43) scale(.82)" color="#146f8b"><use xlink:href="#BABA"/></g>
      <g transform="translate(920 43) scale(.82)" color="#147b76"><use xlink:href="#OPUS"/></g>
    </g>

    <text x="90" y="495" font-size="15" font-weight="750" letter-spacing="2.2" fill="#788c91">ISTI GLIFOVI KAO BROWSER IKONE</text>
    <g transform="translate(90 520)" filter="url(#shadow)">
      <rect width="1320" height="245" rx="28" fill="#fff"/>

      <text x="35" y="45" font-size="13" font-weight="700" letter-spacing="1.5" fill="#82959a">32 PX ASSET</text>
      <g transform="translate(40 68)">
        <rect width="370" height="70" rx="14" fill="#edf2f3"/>
        <g transform="translate(20 19) scale(.333)" color="#0e9db5"><use xlink:href="#D-cut"/></g><text x="66" y="43" font-size="15" font-weight="650" fill="#31484e">Dida</text>
        <g transform="translate(145 19) scale(.333)" color="#146f8b"><use xlink:href="#B-cut"/></g><text x="191" y="43" font-size="15" font-weight="650" fill="#31484e">Baba</text>
        <g transform="translate(270 19) scale(.333)" color="#147b76"><use xlink:href="#O-cut"/></g><text x="316" y="43" font-size="15" font-weight="650" fill="#31484e">Opus</text>
      </g>

      <text x="475" y="45" font-size="13" font-weight="700" letter-spacing="1.5" fill="#82959a">16 PX U STVARNOM TABU</text>
      <g transform="translate(480 68)">
        <rect width="800" height="70" rx="14" fill="#202a2e"/>
        <g transform="translate(24 27) scale(.167)" color="#29c5df"><use xlink:href="#D-cut"/></g><text x="55" y="43" font-size="14" font-weight="600" fill="#e7eef0">Dida</text>
        <path d="M145 18v34" stroke="#536168"/>
        <g transform="translate(172 27) scale(.167)" color="#35c7ed"><use xlink:href="#B-cut"/></g><text x="203" y="43" font-size="14" font-weight="600" fill="#e7eef0">Baba</text>
        <path d="M293 18v34" stroke="#536168"/>
        <g transform="translate(320 27) scale(.167)" color="#70d6ce"><use xlink:href="#O-cut"/></g><text x="351" y="43" font-size="14" font-weight="600" fill="#e7eef0">Opus</text>
      </g>

      <g transform="translate(40 162)">
        <g transform="scale(.67)" color="#0e9db5"><use xlink:href="#D-cut"/></g>
        <g transform="translate(105) scale(.67)" color="#146f8b"><use xlink:href="#B-cut"/></g>
        <g transform="translate(210) scale(.67)" color="#147b76"><use xlink:href="#O-cut"/></g>
        <text x="285" y="30" font-size="15" fill="#5f767c">64 px povećanje za pregled — geometrija nije mijenjana</text>
      </g>
    </g>

    <g transform="translate(90 810)">
      <rect width="1320" height="88" rx="22" fill="#e6edef"/>
      <text x="30" y="35" font-size="13" font-weight="750" letter-spacing="1.8" fill="#70858a">PRAVILO OVE VARIJANTE</text>
      <text x="30" y="64" font-size="15" fill="#40575d">Favicon nije novi znak: to je doslovno početno slovo punog logotipa.</text>
      <text x="1285" y="59" text-anchor="end" font-size="14" fill="#70858a">bez italic nagiba · bez debljanja · bez optičkih korekcija</text>
    </g>
  </g>
</svg>
