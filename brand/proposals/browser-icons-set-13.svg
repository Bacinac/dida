<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1700 940">
  <title>DIDA · BABA · OPUS — editorial browser monograms, set 13</title>
  <desc>Soft serif monograms as fixed vector outlines, optically sized for browser use.</desc>
  <defs>
    <!-- Fixed vector contours based on a soft editorial skeleton. These are
         paths, never runtime text, so every browser renders the same drawing. -->
    <g id="d" fill="currentColor" transform="translate(4 88) scale(.118 -.118)">
      <path d="M748 338C748 625 554 681 338 681H20V599L40 597C96 591 108 577 108 513V168C108 104 96 90 40 84L20 82V0H361C671 0 748 169 748 338ZM556 345C556 190 475 90 350 90C283 90 283 109 283 162V538C283 580 298 591 355 591C480 591 556 498 556 345Z"/>
    </g>
    <g id="b" fill="currentColor" transform="translate(7 88) scale(.118 -.118)">
      <path d="M693 200C693 281 648 340 567 366C627 395 663 449 663 510C663 648 543 681 400 681H20V599L40 597C96 591 108 577 108 513V168C108 104 96 90 40 84L20 82V0H420C520 0 693 11 693 200ZM493 495C493 441 445 410 363 410H283V534C283 566 283 586 365 586C446 586 493 552 493 495ZM511 210C511 134 458 89 370 89C290 89 283 110 283 140V318H366C468 318 511 286 511 210Z"/>
    </g>
    <g id="o" fill="currentColor" transform="translate(2 87) scale(.113 -.113)">
      <path d="M769 346C769 558 611 694 405 694C191 694 35 542 35 334C35 119 198-13 392-13C606-13 769 142 769 346ZM577 344C577 192 506 89 400 89C262 89 227 240 227 338C227 489 300 592 406 592C513 592 577 500 577 344Z"/>
    </g>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#08171c" flood-opacity=".12"/></filter>
  </defs>

  <rect width="1700" height="940" fill="#f5f7f7"/>
  <circle cx="1600" cy="-20" r="320" fill="#e1f4f2"/>
  <circle cx="-70" cy="930" r="290" fill="#e4f2f6"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="90" y="82" font-size="18" font-weight="700" letter-spacing="3" fill="#587076">BROWSER ICONS / EDITORIAL MONOGRAMS · SET 13</text>
    <text x="90" y="138" font-size="40" font-weight="650" fill="#14282e">Samo inicijal. Nacrtan kako treba.</text>
    <text x="90" y="176" font-size="19" fill="#667b80">Mekani serifi · kontrolirani kontrast · fiksne SVG konture · bez dekoracije</text>

    <g transform="translate(90 230)" filter="url(#shadow)">
      <rect width="1520" height="350" rx="32" fill="#fff"/>
      <g transform="translate(70 48)">
        <rect width="400" height="230" rx="26" fill="#f7f9f9" stroke="#e4ebec"/>
        <g transform="translate(104 22) scale(1.9)" color="#0e9db5"><use xlink:href="#d"/></g>
        <text x="200" y="202" text-anchor="middle" font-size="14" font-weight="750" letter-spacing="2" fill="#0e9db5">DIDA</text>
      </g>
      <g transform="translate(560 48)">
        <rect width="400" height="230" rx="26" fill="#f7f9f9" stroke="#e4ebec"/>
        <g transform="translate(104 22) scale(1.9)" color="#146f8b"><use xlink:href="#b"/></g>
        <text x="200" y="202" text-anchor="middle" font-size="14" font-weight="750" letter-spacing="2" fill="#146f8b">BABA</text>
      </g>
      <g transform="translate(1050 48)">
        <rect width="400" height="230" rx="26" fill="#f7f9f9" stroke="#e4ebec"/>
        <g transform="translate(104 22) scale(1.9)" color="#147b76"><use xlink:href="#o"/></g>
        <text x="200" y="202" text-anchor="middle" font-size="14" font-weight="750" letter-spacing="2" fill="#147b76">OPUS</text>
      </g>
      <text x="760" y="320" text-anchor="middle" font-size="14" fill="#839499">isti crtež radi u boji i u jednoj tintnoj boji</text>
    </g>

    <text x="90" y="646" font-size="15" font-weight="750" letter-spacing="2.4" fill="#7b8e92">U BROWSERU</text>
    <text x="90" y="674" font-size="15" fill="#829397">Optičko skaliranje zadržava velike unutarnje bjeline na 16 px.</text>

    <g transform="translate(90 706)">
      <rect width="735" height="120" rx="20" fill="#fff" stroke="#dce5e6"/>
      <rect x="22" y="28" width="691" height="64" rx="14" fill="#edf2f3"/>
      <g transform="translate(52 40) scale(.333)" color="#0e9db5"><use xlink:href="#d"/></g><text x="96" y="67" font-size="16" font-weight="650" fill="#32484e">Dida</text>
      <g transform="translate(264 40) scale(.333)" color="#146f8b"><use xlink:href="#b"/></g><text x="308" y="67" font-size="16" font-weight="650" fill="#32484e">Baba</text>
      <g transform="translate(476 40) scale(.333)" color="#147b76"><use xlink:href="#o"/></g><text x="520" y="67" font-size="16" font-weight="650" fill="#32484e">Opus</text>
      <text x="680" y="67" text-anchor="end" font-size="13" fill="#829397">32 px</text>
    </g>
    <g transform="translate(855 706)">
      <rect width="755" height="120" rx="20" fill="#121a1d"/>
      <rect x="22" y="28" width="711" height="64" rx="14" fill="#202a2e"/>
      <g transform="translate(60 48) scale(.167)" color="#29c5df"><use xlink:href="#d"/></g><text x="96" y="67" font-size="16" font-weight="650" fill="#e3ecee">Dida</text>
      <g transform="translate(272 48) scale(.167)" color="#35c7ed"><use xlink:href="#b"/></g><text x="308" y="67" font-size="16" font-weight="650" fill="#e3ecee">Baba</text>
      <g transform="translate(484 48) scale(.167)" color="#70d6ce"><use xlink:href="#o"/></g><text x="520" y="67" font-size="16" font-weight="650" fill="#e3ecee">Opus</text>
      <text x="700" y="67" text-anchor="end" font-size="13" fill="#829397">16 px</text>
    </g>

    <g transform="translate(90 884)">
      <text font-size="14" font-weight="700" letter-spacing="1.8" fill="#71858a">VEKTORSKI, NE FONT</text>
      <text x="190" font-size="14" fill="#7a8d91">browser učitava gotove konture pa izgled ne ovisi o sustavu ili uređaju</text>
    </g>
  </g>
</svg>
