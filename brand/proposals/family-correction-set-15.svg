<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1700 1100">
  <title>DIDA · BABA · OPUS — unified cut logo and favicon system</title>
  <desc>Accepted cut wordmarks paired with optically strengthened browser initials carrying the same cut. All OPUS apps share one O favicon.</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#08171c" flood-opacity=".12"/></filter>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="96" height="96"><rect width="96" height="96" fill="#fff"/><path d="M55 4h15L53 38H38Z" fill="#000"/></mask>
    <mask id="fav-cut" maskUnits="userSpaceOnUse" x="-24" y="0" width="140" height="96"><rect x="-24" width="140" height="96" fill="#fff"/><path d="M52 2h9L46 35h-9Z" fill="#000"/></mask>

    <!-- Full-logo alphabet: the accepted cut direction. -->
    <g id="D-plain" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v70h18c25 0 39-13 39-35S61 13 36 13H18"/></g>
    <g id="B-plain" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v70M18 13h23c19 0 29 6 29 17s-10 18-29 18H18M41 48c22 0 33 6 33 17s-11 18-33 18H18"/></g>
    <g id="O-plain" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="48" cy="48" rx="31" ry="35"/></g>
    <g id="D-cut" mask="url(#cut)"><use xlink:href="#D-plain"/></g><g id="B-cut" mask="url(#cut)"><use xlink:href="#B-plain"/></g><g id="O-cut" mask="url(#cut)"><use xlink:href="#O-plain"/></g>
    <g id="I" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"><path d="M8 13h28M22 13v70M8 83h28"/></g>
    <g id="A" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M8 83 36 13l28 70M19 58h34"/></g>
    <g id="P" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M18 83V13h24c20 0 31 7 31 20S62 53 42 53H18"/></g>
    <g id="U" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M14 13v42c0 19 12 29 29 29s29-10 29-29V13"/></g>
    <g id="S" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M70 22c-7-6-16-9-26-9-18 0-29 8-29 19 0 27 57 12 57 35 0 11-12 17-29 17-12 0-23-4-31-11"/></g>
    <g id="L" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v70h51"/></g>
    <g id="DIDA"><use xlink:href="#D-cut"/><use xlink:href="#I" transform="translate(86)"/><use xlink:href="#D-plain" transform="translate(138)"/><use xlink:href="#A" transform="translate(224)"/></g>
    <g id="BABA"><use xlink:href="#B-cut"/><use xlink:href="#A" transform="translate(88)"/><use xlink:href="#B-plain" transform="translate(168)"/><use xlink:href="#A" transform="translate(256)"/></g>
    <g id="OPUS"><use xlink:href="#O-cut"/><use xlink:href="#P" transform="translate(92)"/><use xlink:href="#U" transform="translate(180)"/><use xlink:href="#S" transform="translate(270)"/></g>
    <g id="lock-p"><g color="var(--word,#147b76)"><use xlink:href="#OPUS"/></g><rect x="365" y="12" width="3" height="72" rx="1.5" fill="var(--soft,#79aaa6)"/><g transform="translate(380 6.5) scale(.5)" color="var(--module,#c36e12)"><use xlink:href="#P"/></g></g>

    <!-- Browser-only optical initials: true right-leaning italic construction
         and a narrow parallel-sided cut that survives at 16 px. -->
    <g id="fav-d" transform="translate(20) skewX(-12)" mask="url(#fav-cut)" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10v76h18c27 0 42-15 42-38S65 10 38 10H20"/></g>
    <g id="fav-b" transform="translate(20) skewX(-12)" mask="url(#fav-cut)" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10v76M20 10h23c21 0 32 7 32 19S64 48 43 48H20M43 48c24 0 36 7 36 19S67 86 43 86H20"/></g>
    <g id="fav-o" transform="translate(20) skewX(-12)" mask="url(#fav-cut)" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="48" cy="48" rx="34" ry="38"/></g>
  </defs>

  <rect width="1700" height="1100" fill="#f4f7f7"/>
  <circle cx="1600" cy="-20" r="320" fill="#ddf5f2"/>
  <circle cx="-70" cy="1080" r="310" fill="#e1f3f8"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="90" y="82" font-size="18" font-weight="700" letter-spacing="3" fill="#587076">FAMILY SYSTEM / ITALIC FAVICONS</text>
    <text x="90" y="138" font-size="40" font-weight="650" fill="#14282e">Čisti rez. Naglašeni pokret.</text>
    <text x="90" y="176" font-size="19" fill="#667b80">Italic inicijali za browser · jedan zajednički O za sve OPUS aplikacije</text>

    <text x="90" y="242" font-size="15" font-weight="750" letter-spacing="2.4" fill="#7b8e92">PUNI LOGOTIPI — BEZ PROMJENE</text>
    <g transform="translate(90 274)" filter="url(#shadow)">
      <rect width="1520" height="250" rx="30" fill="#fff"/>
      <g transform="translate(80 78) scale(.96)" color="#0e9db5"><use xlink:href="#DIDA"/></g>
      <g transform="translate(500 78) scale(.96)" color="#146f8b"><use xlink:href="#BABA"/></g>
      <g transform="translate(1010 78) scale(.96)"><use xlink:href="#lock-p"/></g>
      <text x="220" y="210" text-anchor="middle" font-size="13" fill="#829397">DIDA</text>
      <text x="660" y="210" text-anchor="middle" font-size="13" fill="#829397">BABA</text>
      <text x="1230" y="210" text-anchor="middle" font-size="13" fill="#829397">OPUS · Player</text>
    </g>

    <text x="90" y="590" font-size="15" font-weight="750" letter-spacing="2.4" fill="#7b8e92">BROWSER IKONE — ITALIC + ČISTI DIJAGONALNI PROREZ</text>
    <text x="90" y="618" font-size="15" fill="#829397">Uži rez ima dvije paralelne stranice; isti O koriste OPUS Player, Display i Library.</text>

    <g transform="translate(90 652)" filter="url(#shadow)">
      <rect width="1520" height="190" rx="30" fill="#fff"/>
      <g transform="translate(55 35) scale(1.2)" color="#0e9db5"><use xlink:href="#fav-d"/></g>
      <g transform="translate(215 35) scale(1.2)" color="#146f8b"><use xlink:href="#fav-b"/></g>
      <g transform="translate(375 35) scale(1.2)" color="#147b76"><use xlink:href="#fav-o"/></g>

      <g transform="translate(560 34)">
        <rect width="924" height="56" rx="13" fill="#edf2f3"/>
        <g transform="translate(26 12) scale(.333)" color="#0e9db5"><use xlink:href="#fav-d"/></g><text x="67" y="36" font-size="14" font-weight="650" fill="#32484e">Dida</text>
        <g transform="translate(176 12) scale(.333)" color="#146f8b"><use xlink:href="#fav-b"/></g><text x="217" y="36" font-size="14" font-weight="650" fill="#32484e">Baba</text>
        <g transform="translate(326 12) scale(.333)" color="#147b76"><use xlink:href="#fav-o"/></g><text x="367" y="36" font-size="14" font-weight="650" fill="#32484e">Player</text>
        <g transform="translate(486 12) scale(.333)" color="#147b76"><use xlink:href="#fav-o"/></g><text x="527" y="36" font-size="14" font-weight="650" fill="#32484e">Display</text>
        <g transform="translate(656 12) scale(.333)" color="#147b76"><use xlink:href="#fav-o"/></g><text x="697" y="36" font-size="14" font-weight="650" fill="#32484e">Library</text>
        <text x="890" y="35" text-anchor="end" font-size="13" fill="#829397">32 px</text>
      </g>
      <g transform="translate(560 106)">
        <rect width="924" height="56" rx="13" fill="#202a2e"/>
        <g transform="translate(34 20) scale(.167)" color="#29c5df"><use xlink:href="#fav-d"/></g><text x="67" y="36" font-size="14" font-weight="650" fill="#e3ecee">Dida</text>
        <g transform="translate(184 20) scale(.167)" color="#35c7ed"><use xlink:href="#fav-b"/></g><text x="217" y="36" font-size="14" font-weight="650" fill="#e3ecee">Baba</text>
        <g transform="translate(334 20) scale(.167)" color="#70d6ce"><use xlink:href="#fav-o"/></g><text x="367" y="36" font-size="14" font-weight="650" fill="#e3ecee">Player</text>
        <g transform="translate(494 20) scale(.167)" color="#70d6ce"><use xlink:href="#fav-o"/></g><text x="527" y="36" font-size="14" font-weight="650" fill="#e3ecee">Display</text>
        <g transform="translate(664 20) scale(.167)" color="#70d6ce"><use xlink:href="#fav-o"/></g><text x="697" y="36" font-size="14" font-weight="650" fill="#e3ecee">Library</text>
        <text x="890" y="35" text-anchor="end" font-size="13" fill="#829397">16 px</text>
      </g>
    </g>

    <g transform="translate(90 902)">
      <rect width="1520" height="118" rx="24" fill="#e7edef"/>
      <text x="34" y="42" font-size="14" font-weight="750" letter-spacing="2" fill="#71858a">PRAVILO SUSTAVA</text>
      <text x="34" y="78" font-size="16" fill="#40565c">Rez više nije izvađeni klin: to je uzak, precizan prorez kroz italic slovo.</text>
      <text x="1450" y="76" text-anchor="end" font-size="14" fill="#71858a">OPUS P / D / L → isti italic O u browseru</text>
    </g>
  </g>
</svg>
