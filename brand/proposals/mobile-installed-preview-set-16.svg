<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1500 1000">
  <title>DIDA, BABA and OPUS installed mobile app preview</title>
  <desc>Upright cut initials shown as installed rounded-square app icons on a mobile home screen.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8f8"/><stop offset="1" stop-color="#e4eff0"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#062d38"/><stop offset=".48" stop-color="#0b5060"/><stop offset="1" stop-color="#146d6b"/></linearGradient>
    <linearGradient id="dida-tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#073844"/><stop offset="1" stop-color="#0d7689"/></linearGradient>
    <linearGradient id="baba-tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a334b"/><stop offset="1" stop-color="#126887"/></linearGradient>
    <linearGradient id="opus-tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#083b3b"/><stop offset="1" stop-color="#147a72"/></linearGradient>
    <filter id="phone-shadow" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#05161c" flood-opacity=".25"/></filter>
    <filter id="icon-shadow" x="-30%" y="-25%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#00191f" flood-opacity=".28"/></filter>
    <mask id="clean-cut" maskUnits="userSpaceOnUse" x="-30" y="0" width="150" height="96"><rect x="-30" width="150" height="96" fill="#fff"/><path d="M52 2h9L46 35h-9Z" fill="#000"/></mask>

    <g id="glyph-d" mask="url(#clean-cut)" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10v76h18c27 0 42-15 42-38S65 10 38 10H20"/></g>
    <g id="glyph-b" mask="url(#clean-cut)" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10v76M20 10h23c21 0 32 7 32 19S64 48 43 48H20M43 48c24 0 36 7 36 19S67 86 43 86H20"/></g>
    <g id="glyph-o" mask="url(#clean-cut)" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="48" cy="48" rx="34" ry="38"/></g>

    <g id="app-dida"><rect width="96" height="96" rx="22" fill="url(#dida-tile)"/><path d="M10 17C31 2 65 2 86 17" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/><g transform="translate(7 7) scale(.84)" color="#48d5e5"><use xlink:href="#glyph-d"/></g></g>
    <g id="app-baba"><rect width="96" height="96" rx="22" fill="url(#baba-tile)"/><path d="M10 17C31 2 65 2 86 17" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/><g transform="translate(7 7) scale(.84)" color="#55c8ef"><use xlink:href="#glyph-b"/></g></g>
    <g id="app-opus"><rect width="96" height="96" rx="22" fill="url(#opus-tile)"/><path d="M10 17C31 2 65 2 86 17" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/><g transform="translate(7 7) scale(.84)" color="#72ddd1"><use xlink:href="#glyph-o"/></g></g>
    <g id="generic-app"><rect width="72" height="72" rx="17" fill="#fff" fill-opacity=".18"/><circle cx="36" cy="30" r="13" fill="#fff" fill-opacity=".3"/><rect x="20" y="51" width="32" height="7" rx="3.5" fill="#fff" fill-opacity=".22"/></g>
  </defs>

  <rect width="1500" height="1000" fill="url(#page)"/>
  <circle cx="80" cy="930" r="260" fill="#d8f1f2"/>
  <circle cx="1420" cy="40" r="250" fill="#d9f1ec"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="90" y="90" font-size="18" font-weight="750" letter-spacing="3" fill="#577178">INSTALLED APP PREVIEW · SET 16</text>
    <text x="90" y="148" font-size="42" font-weight="680" fill="#132a31">Kako znak živi na mobitelu</text>
    <text x="90" y="188" font-size="19" fill="#637b81">Uspravni inicijal i čisti rez, na pravoj aplikacijskoj pločici.</text>

    <g transform="translate(90 260)">
      <text y="0" font-size="15" font-weight="750" letter-spacing="2.3" fill="#71888e">POVEĆANI PRIKAZ IKONA</text>
      <g transform="translate(0 45) scale(1.35)" filter="url(#icon-shadow)"><use xlink:href="#app-dida"/></g>
      <g transform="translate(165 45) scale(1.35)" filter="url(#icon-shadow)"><use xlink:href="#app-baba"/></g>
      <g transform="translate(330 45) scale(1.35)" filter="url(#icon-shadow)"><use xlink:href="#app-opus"/></g>
      <text x="65" y="205" text-anchor="middle" font-size="16" font-weight="650" fill="#263d43">Dida</text>
      <text x="230" y="205" text-anchor="middle" font-size="16" font-weight="650" fill="#263d43">Baba</text>
      <text x="395" y="205" text-anchor="middle" font-size="16" font-weight="650" fill="#263d43">Opus</text>

      <rect y="270" width="570" height="190" rx="26" fill="#fff"/>
      <text x="28" y="310" font-size="14" font-weight="750" letter-spacing="2" fill="#71888e">OPUS PRAVILO</text>
      <g transform="translate(30 335) scale(.62)"><use xlink:href="#app-opus"/></g>
      <g transform="translate(190 335) scale(.62)"><use xlink:href="#app-opus"/></g>
      <g transform="translate(350 335) scale(.62)"><use xlink:href="#app-opus"/></g>
      <text x="92" y="374" font-size="15" font-weight="650" fill="#324a50">Player</text>
      <text x="252" y="374" font-size="15" font-weight="650" fill="#324a50">Display</text>
      <text x="412" y="374" font-size="15" font-weight="650" fill="#324a50">Library</text>
      <text x="28" y="432" font-size="14" fill="#71858b">Ikona je namjerno ista; aplikacije razlikuje naziv ispod nje.</text>

      <text y="525" font-size="15" font-weight="750" letter-spacing="2.3" fill="#71888e">VAŽAN DOJAM</text>
      <text y="560" font-size="17" fill="#40585e">Bez nagiba znak djeluje mirnije, stabilnije i centriranije,</text>
      <text y="588" font-size="17" fill="#40585e">dok čisti dijagonalni rez zadržava karakter obitelji.</text>
    </g>

    <g transform="translate(800 55)" filter="url(#phone-shadow)">
      <rect width="520" height="900" rx="72" fill="#0c171b"/>
      <rect x="13" y="13" width="494" height="874" rx="61" fill="url(#wall)"/>
      <circle cx="410" cy="170" r="210" fill="#49b9ac" opacity=".16"/>
      <circle cx="70" cy="700" r="240" fill="#1a91a6" opacity=".14"/>
      <rect x="195" y="28" width="130" height="34" rx="17" fill="#061216"/>
      <text x="50" y="53" font-size="15" font-weight="650" fill="#fff">9:41</text>
      <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
        <path d="M426 46h4m6-4v4m6-8v8"/>
        <path d="M454 43c5-5 12-5 17 0m-13 4c3-3 7-3 10 0"/>
        <rect x="480" y="38" width="18" height="10" rx="3"/><path d="M500 41v4"/>
      </g>

      <text x="260" y="112" text-anchor="middle" font-size="28" font-weight="600" fill="#fff">21. rujna</text>
      <text x="260" y="143" text-anchor="middle" font-size="17" fill="#fff" fill-opacity=".78">ponedjeljak</text>

      <g transform="translate(48 206)">
        <g filter="url(#icon-shadow)"><use xlink:href="#app-dida"/></g>
        <g transform="translate(126)" filter="url(#icon-shadow)"><use xlink:href="#app-baba"/></g>
        <g transform="translate(252)" filter="url(#icon-shadow)"><use xlink:href="#app-opus"/></g>
        <g transform="translate(378)" filter="url(#icon-shadow)"><use xlink:href="#app-opus"/></g>
        <g fill="#fff" font-size="13" font-weight="550" text-anchor="middle">
          <text x="48" y="121">Dida</text><text x="174" y="121">Baba</text><text x="300" y="121">Player</text><text x="426" y="121">Display</text>
        </g>

        <g transform="translate(0 160)" filter="url(#icon-shadow)"><use xlink:href="#app-opus"/></g>
        <g transform="translate(138 172)"><use xlink:href="#generic-app"/></g>
        <g transform="translate(264 172)"><use xlink:href="#generic-app"/></g>
        <g transform="translate(390 172)"><use xlink:href="#generic-app"/></g>
        <g fill="#fff" font-size="13" font-weight="550" text-anchor="middle">
          <text x="48" y="281">Library</text><text x="174" y="281">Fotografije</text><text x="300" y="281">Bilješke</text><text x="426" y="281">Postavke</text>
        </g>
      </g>

      <g transform="translate(45 762)">
        <rect width="430" height="102" rx="34" fill="#e8ffff" fill-opacity=".16" stroke="#fff" stroke-opacity=".12"/>
        <g transform="translate(24 15)"><use xlink:href="#generic-app"/></g>
        <g transform="translate(126 15)"><use xlink:href="#generic-app"/></g>
        <g transform="translate(228 15)"><use xlink:href="#generic-app"/></g>
        <g transform="translate(330 15)"><use xlink:href="#generic-app"/></g>
      </g>
      <rect x="202" y="874" width="116" height="5" rx="2.5" fill="#fff" fill-opacity=".75"/>
    </g>
  </g>
</svg>
