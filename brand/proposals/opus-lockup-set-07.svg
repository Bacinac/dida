<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 860">
  <title>OPUS lockups — set 07</title>
  <desc>Cut OPUS wordmark with a thin divider and fixed-width apricot module cell.</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#08171c" flood-opacity=".14"/>
    </filter>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="96" height="96">
      <rect width="96" height="96" fill="#fff"/><path d="M55 4h15L53 38H38Z" fill="#000"/>
    </mask>
    <g id="O-plain" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="48" cy="48" rx="31" ry="35"/></g>
    <g id="O-cut" mask="url(#cut)"><use xlink:href="#O-plain"/></g>
    <g id="P" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M18 83V13h24c20 0 31 7 31 20S62 53 42 53H18"/></g>
    <g id="U" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M14 13v42c0 19 12 29 29 29s29-10 29-29V13"/></g>
    <g id="S" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M70 22c-7-6-16-9-26-9-18 0-29 8-29 19 0 27 57 12 57 35 0 11-12 17-29 17-12 0-23-4-31-11"/></g>
    <g id="D" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v70h18c25 0 39-13 39-35S61 13 36 13H18"/></g>
    <g id="L" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v70h51"/></g>
    <g id="OPUS"><use xlink:href="#O-cut"/><use xlink:href="#P" transform="translate(92)"/><use xlink:href="#U" transform="translate(180)"/><use xlink:href="#S" transform="translate(270)"/></g>

    <!-- The full lockup is always 480 units wide. Divider position and module
         cell never change; P, D and L are optically centred inside that cell. -->
    <g id="lock-p"><g color="var(--word, #147b76)"><use xlink:href="#OPUS"/></g><rect x="365" y="12" width="3" height="72" rx="1.5" fill="var(--soft, #79aaa6)"/><g transform="translate(380 6.5) scale(.5)" color="var(--module, #c36e12)"><use xlink:href="#P"/></g></g>
    <g id="lock-d"><g color="var(--word, #147b76)"><use xlink:href="#OPUS"/></g><rect x="365" y="12" width="3" height="72" rx="1.5" fill="var(--soft, #79aaa6)"/><g transform="translate(379 6.5) scale(.5)" color="var(--module, #c36e12)"><use xlink:href="#D"/></g></g>
    <g id="lock-l"><g color="var(--word, #147b76)"><use xlink:href="#OPUS"/></g><rect x="365" y="12" width="3" height="72" rx="1.5" fill="var(--soft, #79aaa6)"/><g transform="translate(381 6.5) scale(.5)" color="var(--module, #c36e12)"><use xlink:href="#L"/></g></g>
  </defs>

  <rect width="1600" height="860" fill="#f3f7f7"/>
  <circle cx="1500" cy="-20" r="300" fill="#ddf5f2"/>
  <circle cx="-60" cy="850" r="280" fill="#e1f3f8"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="90" y="82" font-size="18" font-weight="700" letter-spacing="3" fill="#587076">OPUS / LOCKUP · SET 07</text>
    <text x="90" y="138" font-size="40" font-weight="650" fill="#14282e">Rezani OPUS, tanka crta, marelica.</text>
    <text x="90" y="176" font-size="19" fill="#667b80">Karakter novog znaka · mir i jasnoća izvornog module lockupa</text>

    <text x="90" y="244" font-size="15" font-weight="750" letter-spacing="2.4" fill="#7b8e92">TRI MODULA / JEDNAKA ŠIRINA</text>
    <text x="90" y="272" font-size="15" fill="#829397">Crta i modul imaju fiksni položaj; centar cijelog lockupa ne mijenja se.</text>

    <g filter="url(#shadow)">
      <g transform="translate(90 310)"><rect width="440" height="220" rx="30" fill="#fff"/><line x1="220" y1="18" x2="220" y2="202" stroke="#dce8ea" stroke-dasharray="4 8"/><g transform="translate(28 68) scale(.8)"><use xlink:href="#lock-p"/></g></g>
      <g transform="translate(580 310)"><rect width="440" height="220" rx="30" fill="#fff"/><line x1="220" y1="18" x2="220" y2="202" stroke="#dce8ea" stroke-dasharray="4 8"/><g transform="translate(28 68) scale(.8)"><use xlink:href="#lock-d"/></g></g>
      <g transform="translate(1070 310)"><rect width="440" height="220" rx="30" fill="#fff"/><line x1="220" y1="18" x2="220" y2="202" stroke="#dce8ea" stroke-dasharray="4 8"/><g transform="translate(28 68) scale(.8)"><use xlink:href="#lock-l"/></g></g>
    </g>
    <text x="310" y="562" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2" fill="#8a5a25">PLAYER</text>
    <text x="800" y="562" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2" fill="#8a5a25">DOWNLOADS</text>
    <text x="1290" y="562" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2" fill="#8a5a25">LIBRARY</text>

    <g transform="translate(90 620)">
      <rect width="470" height="166" rx="24" fill="#e6edef"/>
      <text x="30" y="38" font-size="14" font-weight="700" letter-spacing="1.8" fill="#71858a">FIKSNA KONSTRUKCIJA</text>
      <line x1="72" y1="72" x2="72" y2="136" stroke="#79aaa6" stroke-width="3"/>
      <rect x="96" y="84" width="62" height="42" rx="8" fill="#f1d5b4"/>
      <text x="127" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#9a5908">P/D/L</text>
      <path d="M188 104h44" stroke="#9fb0b4" stroke-width="2"/>
      <text x="252" y="92" font-size="15" fill="#40565c">ista ćelija za svaki modul</text>
      <text x="252" y="120" font-size="15" fill="#71858a">nema skakanja između ekrana</text>
    </g>

    <g transform="translate(610 620)">
      <text x="0" y="20" font-size="15" font-weight="750" letter-spacing="2.4" fill="#7b8e92">STVARNO ZAGLAVLJE</text>
      <rect y="42" width="900" height="116" rx="22" fill="#142023"/>
      <circle cx="42" cy="100" r="19" fill="#223136"/><path d="m48 89-11 11 11 11" fill="none" stroke="#9baaad" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="858" cy="100" r="19" fill="#223136"/><circle cx="858" cy="95" r="5" fill="none" stroke="#9baaad" stroke-width="2"/><path d="M848 111c2-7 18-7 20 0" fill="none" stroke="#9baaad" stroke-width="2" stroke-linecap="round"/>
      <line x1="450" y1="52" x2="450" y2="148" stroke="#33474c" stroke-dasharray="3 7"/>
      <g transform="translate(318 70) scale(.55)" style="--word:#70d6ce;--soft:#4ba9a3;--module:#f0aa5a"><use xlink:href="#lock-p"/></g>
    </g>

    <g transform="translate(90 824)">
      <g transform="scale(.34)" color="#147b76"><use xlink:href="#O-cut"/></g>
      <text x="45" y="24" font-size="14" fill="#63787d">browser ostaje samo O</text>
    </g>
  </g>
</svg>
