<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900">
  <title>OPUS module marks — set 04</title>
  <desc>OPUS module initials integrated into the counter of the leading O.</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#08171c" flood-opacity=".14"/>
    </filter>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="96" height="96">
      <rect width="96" height="96" fill="#fff"/>
      <path d="M55 4h15L53 38H38Z" fill="#000"/>
    </mask>

    <g id="O-plain" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="48" cy="48" rx="31" ry="35"/>
    </g>
    <g id="O-cut" mask="url(#cut)"><use xlink:href="#O-plain"/></g>
    <g id="P" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 83V13h24c20 0 31 7 31 20S62 53 42 53H18"/>
    </g>
    <g id="U" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 13v42c0 19 12 29 29 29s29-10 29-29V13"/>
    </g>
    <g id="S" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 22c-7-6-16-9-26-9-18 0-29 8-29 19 0 27 57 12 57 35 0 11-12 17-29 17-12 0-23-4-31-11"/>
    </g>
    <g id="D" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 13v70h18c25 0 39-13 39-35S61 13 36 13H18"/>
    </g>
    <g id="L" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 13v70h51"/>
    </g>

    <!-- Product wordmark. The module never contributes to its bounding box. -->
    <g id="OPUS"><use xlink:href="#O-cut"/><use xlink:href="#P" transform="translate(92)"/><use xlink:href="#U" transform="translate(180)"/><use xlink:href="#S" transform="translate(270)"/></g>

    <!-- Initials are optically centred inside O's counter, not mathematically
         placed from their unequal path boxes. -->
    <g id="inside-p"><g transform="translate(35.5 34.5) scale(.28)"><use xlink:href="#P"/></g></g>
    <g id="inside-d"><g transform="translate(35.2 34.5) scale(.28)"><use xlink:href="#D"/></g></g>
    <g id="inside-l"><g transform="translate(35.7 34.5) scale(.28)"><use xlink:href="#L"/></g></g>
  </defs>

  <rect width="1600" height="900" fill="#f3f7f7"/>
  <circle cx="1500" cy="-20" r="300" fill="#ddf5f2"/>
  <circle cx="-60" cy="880" r="280" fill="#e1f3f8"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="90" y="82" font-size="18" font-weight="700" letter-spacing="3" fill="#587076">OPUS / MODULES · SET 04</text>
    <text x="90" y="138" font-size="40" font-weight="650" fill="#14282e">Modul živi unutar slova O.</text>
    <text x="90" y="176" font-size="19" fill="#667b80">Nema sufiksa · nema drugog reda · nema pomicanja centra</text>

    <text x="90" y="250" font-size="15" font-weight="750" letter-spacing="2.4" fill="#7b8e92">TRI MODULA / JEDNAKA SILUETA</text>
    <text x="90" y="278" font-size="15" fill="#829397">Početno O postaje nosač informacije, a ostatak wordmarka ostaje netaknut.</text>

    <!-- Equal cards and centre guides demonstrate invariant geometry. -->
    <g filter="url(#shadow)">
      <g transform="translate(90 316)">
        <rect width="440" height="250" rx="30" fill="#fff"/>
        <line x1="220" y1="20" x2="220" y2="230" stroke="#deeaeb" stroke-dasharray="4 8"/>
        <g transform="translate(38 70) scale(1.05)" color="#147b76"><use xlink:href="#OPUS"/></g>
        <g transform="translate(38 70) scale(1.05)" color="#c36e12"><use xlink:href="#inside-p"/></g>
      </g>
      <g transform="translate(580 316)">
        <rect width="440" height="250" rx="30" fill="#fff"/>
        <line x1="220" y1="20" x2="220" y2="230" stroke="#deeaeb" stroke-dasharray="4 8"/>
        <g transform="translate(38 70) scale(1.05)" color="#147b76"><use xlink:href="#OPUS"/></g>
        <g transform="translate(38 70) scale(1.05)" color="#c36e12"><use xlink:href="#inside-d"/></g>
      </g>
      <g transform="translate(1070 316)">
        <rect width="440" height="250" rx="30" fill="#fff"/>
        <line x1="220" y1="20" x2="220" y2="230" stroke="#deeaeb" stroke-dasharray="4 8"/>
        <g transform="translate(38 70) scale(1.05)" color="#147b76"><use xlink:href="#OPUS"/></g>
        <g transform="translate(38 70) scale(1.05)" color="#c36e12"><use xlink:href="#inside-l"/></g>
      </g>
    </g>
    <text x="310" y="595" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2" fill="#8a5a25">PLAYER</text>
    <text x="800" y="595" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2" fill="#8a5a25">DOWNLOADS</text>
    <text x="1290" y="595" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2" fill="#8a5a25">LIBRARY</text>

    <text x="90" y="642" font-size="15" font-weight="750" letter-spacing="2.4" fill="#7b8e92">U STVARNOM ZAGLAVLJU</text>
    <text x="90" y="670" font-size="15" fill="#829397">Wordmark se centrira kao jedna fiksna kutija; lijeve i desne kontrole ne utječu na njega.</text>

    <g transform="translate(90 706)">
      <rect width="1420" height="118" rx="22" fill="#142023"/>
      <circle cx="48" cy="59" r="20" fill="#223136"/><path d="m54 47-12 12 12 12" fill="none" stroke="#9baaad" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1372" cy="59" r="20" fill="#223136"/><circle cx="1372" cy="54" r="5" fill="none" stroke="#9baaad" stroke-width="2"/><path d="M1362 70c2-7 18-7 20 0" fill="none" stroke="#9baaad" stroke-width="2" stroke-linecap="round"/>
      <line x1="710" y1="12" x2="710" y2="106" stroke="#33474c" stroke-dasharray="3 7"/>
      <g transform="translate(596 32) scale(.64)" color="#70d6ce"><use xlink:href="#OPUS"/></g>
      <g transform="translate(596 32) scale(.64)" color="#f0aa5a"><use xlink:href="#inside-p"/></g>
    </g>

    <g transform="translate(90 858)">
      <g transform="scale(.34)" color="#147b76"><use xlink:href="#O-cut"/></g>
      <text x="43" y="24" font-size="14" fill="#63787d">browser: samo O</text>
      <line x1="190" y1="10" x2="190" y2="31" stroke="#cbd7d9"/>
      <g transform="translate(220 -4) scale(.38)" color="#147b76"><use xlink:href="#OPUS"/></g>
      <g transform="translate(220 -4) scale(.38)" color="#c36e12"><use xlink:href="#inside-p"/></g>
      <text x="366" y="24" font-size="14" fill="#63787d">aplikacija: modul unutar O</text>
    </g>
  </g>
</svg>
