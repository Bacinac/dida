[project]
name = "dida-core"
version = "0.1.0"
description = "DIDA core: canonical capability model, bus, plugin registry"
requires-python = ">=3.14"
dependencies = [
    "msgspec>=0.19",
    "nats-py>=2.9",
    "uvloop>=0.21",  # service runtime (dida_core.run_service)
    "cryptography>=49",  # floor = the version already shipped: `uv lock --upgrade`
                     # resolved it DOWNWARD (49 -> 48.0.1) with a >=43 bound, and a
                     # crypto library must never go backwards on a routine refresh.  # adapter-config secret encryption (Fernet)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_core", "src/home_core"]
exclude = ["src/home_core/tests"]
