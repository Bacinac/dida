  planvision:
    # One-shot raster floor-plan → vector room polygons (classical CV on CPU:
    # adaptive threshold → wall thickness filter → seal doors → watershed to the
    # true walls → sliver merge → Douglas-Peucker). Stateless HTTP: the api reads
    # a floor's scaffold from /state and POSTs the bytes here. Its own base, no
    # core / DB / NATS. Bridge net; the api reaches it at planvision:8094 (no host
    # port needed).
    build:
      context: .
      dockerfile: services/planvision/Dockerfile
    image: dida/planvision:latest
    container_name: dida-planvision
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    # Backstop against a CV-pathology OOM (a huge/adversarial floor-plan raster
    # blowing up watershed/skeletonize) taking the host down.
    mem_limit: 512m
    environment:
      DIDA_PLANVISION_PORT: "8094"
      # Decompression-bomb guard (~64 MPx) for OpenCV image decode; paired with a
      # server-side pixel-count check in the planvision code.
      OPENCV_IO_MAX_IMAGE_PIXELS: "67108864"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8094/healthz\", timeout=3).read() else 1)' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  matter-bridge:
    # Exposes DIDA entities as Matter devices so any Matter controller (Google
    # Home / Alexa / Apple) adopts and controls them LOCALLY — no cloud, no
    # OAuth, no public endpoint. Matter advertises over mDNS and must share the
    # LAN with the controller, so this runs with host networking. Fabric +
    # commissioning credentials persist under state/matter-bridge. Opt-in
    # `matter` profile (experimental). Node/TS service on matter.js.
    profiles: ["matter"]
    build:
      context: .
      dockerfile: services/matter-bridge/Dockerfile
    image: dida/matter-bridge:latest
    container_name: dida-matter-bridge
    security_opt:
      - "no-new-privileges:true"
    # PID-1 reaper + SIGTERM forwarding: Node as PID 1 gets no default SIGTERM
    # action, so `docker stop` would wait the full stop-timeout then SIGKILL. tini
    # forwards the signal (the in-process handler in index.ts drains cleanly).
    init: true
    network_mode: host
    <<: *dida-logging
    environment:
      DIDA_MATTER_STORAGE: /state
      DIDA_MATTER_PORT: ${DIDA_MATTER_PORT:-5540}
      # Activity pickers (source/source_options entities, e.g. harmony:hub):
      # every source option becomes a voiceable Matter plug ("turn on PS5").
      DIDA_MATTER_ACTIVITY_ENTITIES: ${DIDA_MATTER_ACTIVITY_ENTITIES:-}
      # Host networking exposes every Docker veth — pin Matter/mDNS to the LAN
      # NIC so the controller only ever sees the reachable host address, and
      # quiet matter.js's debug firehose.
      MATTER_MDNS_NETWORKINTERFACE: ${DIDA_MATTER_INTERFACE:-ens18}
      MATTER_LOG_LEVEL: info
      # host networking: reach DIDA's bus via the host-published localhost port
      DIDA_NATS_URL: nats://127.0.0.1:4232
      DIDA_NATS_PASSWORD_FILE: /run/dida-key/nats
    volumes:
      - ${DIDA_STATE_HOST}/matter-bridge:/state
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: matter-bridge
    depends_on:
      keys:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_matter-bridge 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s

volumes:
  dida-keys:
  # Filtered Docker API sockets, one per consumer (see docker-proxy-*). tmpfs owned
  # by the proxy's uid: it runs as nobody and must create its socket here.
  docker_api_netmgr:
    driver: local
    driver_opts: &docker-api-tmpfs
      type: tmpfs
      device: tmpfs
      o: "uid=65534,gid=65534,mode=0755"
  docker_api_govee:
    driver: local
    driver_opts: *docker-api-tmpfs
  # Govee account creds, rendered by the govee adapter for the bridge to source.
  # tmpfs (RAM) — the encrypted `adapter_config` DB row is the single source of
  # truth; this is a transient render that never touches disk, shared between the
  # adapter (writer) and the bridge (reader). Empty after a host reboot → the
  # adapter repopulates it from the DB on start, so it self-heals.
  govee_creds:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  # govee2mqtt's persistent API cache + AWS IoT key. Named volume so it inits with
  # the image's /data ownership (uid 1000) — a root-owned bind would crash the
  # non-root process on cache open.
  govee_data:
  # Live screen snapshots (ADB screencap) — adapter-androidtv writes, api serves.
  androidtv_snap:
