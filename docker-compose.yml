name: dida

# DIDA — Distributed Isolated Device Automation.
# One storage tier (everything small & hot): postgres, NATS jetstream and
# clickhouse all under DIDA_STATE_HOST. Service logs go to stdout (captured by
# the json-file driver, capped per container), not to a logs volume.

# Shared env for DIDA services. Each logs into the bus as itself (an adapter by its
# name, the core services as `core`) with the password the keys service wrote into
# the directory it mounts at /run/dida-key; what each identity may do on the bus is
# dida_core.identity's. Host-networked services override the URL with the published
# loopback port.
x-dida-env: &dida-env
  DIDA_NATS_URL: nats://nats:4222
  DIDA_NATS_PASSWORD_FILE: /run/dida-key/nats
  # Verbosity, per container. Every service is its own container, so setting
  # this for ONE adapter in .env raises just that adapter to DEBUG — no code
  # edit, no rebuild, which is the only version of this that helps mid-incident.
  DIDA_LOG_LEVEL: ${DIDA_LOG_LEVEL:-INFO}
  DIDA_STATE_PATH: /state

# Postgres connection env, DRY'd. A service logs in as its own role
# (dida_core.db_roles) with the password the keys service wrote into the directory
# it mounts at /run/dida-db; the superuser's stays with postgres and keys.
x-dida-pg: &dida-pg
  POSTGRES_HOST: postgres
  POSTGRES_USER: dida_app
  POSTGRES_PASSWORD_FILE: /run/dida-db/password
  POSTGRES_DB: ${POSTGRES_DB:-dida}

# Cap each container's json log at ~250 MB (5 × 50 MB) so a runaway loop
# can't fill the host disk.
x-dida-logging: &dida-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

x-docker-proxy: &docker-proxy
  image: wollomatic/socket-proxy:1.13.1
  network_mode: none
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - "no-new-privileges:true"
  group_add:
    - "${DIDA_DOCKER_GID:?DIDA_DOCKER_GID unset — run install.sh or deploy/upgrade.sh}"
  <<: *dida-logging
  restart: unless-stopped

services:

  # ---------------------------------------------------------------------
  # Shared base image. Builds only under the `bases` profile; never runs.
  #   docker compose --profile bases build
  # Rebuild only when core/ or docker/base.Dockerfile change.
  # ---------------------------------------------------------------------
  base:
    profiles: [bases]
    image: dida/base:latest
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    command: ["true"]

  nats:
    image: nats:2.14-alpine
    container_name: dida-nats
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    # The user list is the keys service's (one login per bus identity, derived from
    # DIDA_SECRET_KEY); nats-run.sh reloads it when a later `up` changes it.
    command: ["sh", "/etc/nats/nats-run.sh"]
    ports:
      - "127.0.0.1:4232:4222"
    volumes:
      - ${DIDA_STATE_HOST}/nats:/data
      - ./docker/nats.conf:/etc/nats/nats.conf:ro
      - ./docker/nats-run.sh:/etc/nats/nats-run.sh:ro
      - type: volume
        source: dida-keys
        target: /etc/nats/auth
        read_only: true
        volume:
          subpath: nats-server
    depends_on:
      keys:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  keys:
    # One-shot: writes each broker client's key, each bus identity's password (and
    # the NATS server's user list) and each database role's password, all derived
    # from DIDA_SECRET_KEY, into its own directory of dida-keys, which only its
    # services mount, then provisions the roles as the superuser. The root key
    # stays with the api — it signs every login. See dida_core.identity. The api's
    # image, because the base carries no database driver.
    image: dida/api:latest
    container_name: dida-keys
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    user: "0:0"
    command: ["python", "-m", "dida_core.identity"]
    environment:
      DIDA_SECRET_KEY: ${DIDA_SECRET_KEY:?DIDA_SECRET_KEY unset — run install.sh}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-dida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dida}
    volumes:
      - dida-keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    # The MAJOR is the load-bearing pin: Postgres refuses a data directory written
    # by a different major, so `pg18` is what stops an upgrade from bricking the DB.
    # Minor updates within it are wanted (security fixes) and are safe in place.
    image: pgvector/pgvector:pg18
    container_name: dida-postgres
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    # Bound to localhost for the host-networked lanprobe (it can't resolve the
    # Docker-network service name).
    ports:
      - "127.0.0.1:${DIDA_PG_HOST_PORT:-5442}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dida}
    volumes:
      # pg18+ stores data in a major-version subdir, so the image expects the
      # mount at /var/lib/postgresql (not /…/data). Fresh dir; data migrated
      # from the old pg17 `postgres` dir via dump→restore. initdb applies the
      # schema once on first boot.
      - ${DIDA_STATE_HOST}/pgdata18:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dida} -d ${POSTGRES_DB:-dida}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  clickhouse:
    # History / event firehose. Running from Phase 0 so the engine's history
    # append (Phase 1) lands without infra churn. LTS tag; bump deliberately.
    image: clickhouse/clickhouse-server:25.8
    container_name: dida-clickhouse
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-dida}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dida}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ${DIDA_STATE_HOST}/clickhouse:/var/lib/clickhouse
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  mosquitto:
    # Local MQTT broker. In real deployments zigbee2mqtt / zwave-js publish
    # here; the mqtt adapter bridges it onto the DIDA bus.
    # Pinned by DIGEST because upstream publishes no exact tag for what `:2`
    # currently is: the binary reports 2.1.2 and no 2.1.2 tag exists, so the only
    # exact tag (2.0.20) would be a downgrade. The digest is what is running.
    image: eclipse-mosquitto:2@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    container_name: dida-mosquitto
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto.passwd:/mosquitto/config/passwd:ro
      - ${DIDA_STATE_HOST}/mosquitto:/mosquitto/data
    restart: unless-stopped
    healthcheck:
      # Liveness (auth is on, so a real MQTT ping would need creds): the broker
      # process must exist. Catches a crashed/exited broker so compose surfaces
      # it instead of leaving dependents silently pointing at a dead port.
      test: ["CMD-SHELL", "pidof mosquitto || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # zigbee2mqtt — the Zigbee BRIDGE (we consume bridges, never reimplement the
  # stack). Reaches the coordinator either over TCP (network coordinator) or on
  # a USB stick passed in as DIDA_ZIGBEE_DEVICE, and publishes to mosquitto,
  # where adapter-mqtt picks it up.
  #
  # Gated behind the `zigbee` profile: the coordinator is single-owner, so this
  # must NOT auto-start while HA/ZHA still holds it. Cutover:
  #   1) free the coordinator (disable ZHA in HA)
  #   2) seed state/zigbee2mqtt/ with the network backup (no re-pair)
  #   3) docker compose --profile zigbee up -d zigbee2mqtt
  zigbee2mqtt:
    profiles: ["zigbee"]
    image: ghcr.io/koenkk/zigbee2mqtt:2.13.0
    container_name: dida-zigbee2mqtt
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    environment:
      TZ: ${DIDA_TZ:-Europe/Zagreb}
    devices:
      # The USB stick lands on a fixed in-container path, so configuration.yaml
      # says `/dev/zigbee` on every host regardless of the by-id name outside.
      # A network coordinator leaves DIDA_ZIGBEE_DEVICE unset; /dev/null is the
      # inert stand-in, since compose has no way to drop a list entry.
      - ${DIDA_ZIGBEE_DEVICE:-/dev/null}:/dev/zigbee
    volumes:
      - ${DIDA_STATE_HOST}/zigbee2mqtt:/app/data
    ports:
      # Exposed on the LAN (0.0.0.0) so the z2m frontend is reachable at
      # http://<host>:8092 — network map / LQI / permit-join during onboarding.
      - "${DIDA_Z2M_PORT:-8092}:8080"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # z2m frontend on 8080 in-container (koenkk image ships busybox wget).
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ESPHome dashboard — compiles and flashes the nodes THIS installation owns.
  # It is a build toolchain, not a runtime dependency: adapter-esphome talks to
  # finished nodes over their native API and does not need this running. Gated
  # behind the `esphome` profile so a normal installation carries none of it.
  #
  # It belongs on the DIDA host rather than the dev box because OTA needs to
  # reach the node directly, and a second installation is a different LAN. Host
  # networking for the same reason (and so the dashboard's ping status works).
  # The first flash of a virgin board is USB, from a laptop next to it.
  esphome:
    profiles: ["esphome-dashboard"]
    image: esphome/esphome:2026.7.3
    container_name: dida-esphome
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    network_mode: host
    environment:
      TZ: ${DIDA_TZ:-Europe/Zagreb}
      ESPHOME_DASHBOARD_USE_PING: "true"
    volumes:
      - ${DIDA_STATE_HOST}/esphome:/config
    restart: unless-stopped
    healthcheck:
      # The dashboard is a python app, so python is the one interpreter the
      # image is guaranteed to ship (no curl, no busybox wget).
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:6052/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  govee2mqtt:
    # Govee bridge (Wez Furlong). Talks to Govee over the account/AWS-IoT path
    # (realtime, no LAN needed) + optional API key + LAN, and republishes every
    # device as Home Assistant MQTT Discovery onto OUR mosquitto — which the
    # co-located `govee` adapter itself ingests. Account credentials come from govee.env, which the
    # `govee` adapter writes from Settings → Adapters (then restarts this). Broker
    # settings are static (our mosquitto); the bridge idles until creds are set.
    profiles: ["govee"]
    build:
      context: .
      dockerfile: docker/govee2mqtt.Dockerfile
    image: dida/govee2mqtt:latest
    container_name: dida-govee2mqtt
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    environment:
      TZ: ${DIDA_TZ:-Europe/Zagreb}
      GOVEE_MQTT_HOST: mosquitto
      GOVEE_MQTT_PORT: "1883"
      GOVEE_MQTT_USER: ${DIDA_MQTT_USERNAME:-dida}
      GOVEE_MQTT_PASSWORD: ${DIDA_MQTT_PASSWORD}
    volumes:
      # /govee: account creds (govee.env) — RAM-only, written by the govee adapter
      # and sourced by the entrypoint; never on disk. /data: named volume (owned by
      # uid 1000 via the image) for the API cache + AWS IoT key across boots.
      - govee_creds:/govee
      - govee_data:/data
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  adapter-govee:
    # Owns the whole Govee path: the Settings → Adapters form for Govee creds
    # (writes the bridge's env + restarts it over the Docker socket), AND consumes
    # the HA MQTT Discovery the bridge publishes on our mosquitto → govee: entities.
    build:
      context: .
      dockerfile: adapters/govee/Dockerfile
    image: dida/adapter-govee:latest
    container_name: dida-adapter-govee
    security_opt:
      - "no-new-privileges:true"
    profiles: ["govee"]
    <<: *dida-logging
    environment:
      <<: *dida-env
      GOVEE_ENV_PATH: /govee/govee.env
      DIDA_MQTT_HOST: mosquitto
      DIDA_MQTT_USERNAME: ${DIDA_MQTT_USERNAME:-dida}
      DIDA_MQTT_PASSWORD: ${DIDA_MQTT_PASSWORD}
      DOCKER_SOCK: /docker/docker.sock
    volumes:
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: govee
      # govee_creds: the RAM-only volume where we render the bridge's govee.env
      # (shared with it). /state: persist the discovered device registry.
      - govee_creds:/govee
      - ${DIDA_STATE_HOST}/adapter-govee:/state
      - docker_api_govee:/docker
    depends_on:
      keys:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      docker-proxy-govee:
        condition: service_started
      nats:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_adapter-govee 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4

  engine:
    build:
      context: .
      dockerfile: services/engine/Dockerfile
    image: dida/engine:latest
    container_name: dida-engine
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    environment:
      <<: [*dida-env, *dida-pg]
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-dida}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dida}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ${DIDA_STATE_HOST}/engine:/state
      - type: volume
        source: dida-keys
        target: /run/dida-db
        read_only: true
        volume:
          subpath: db-dida_app
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: core
    depends_on:
      keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      clickhouse:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_engine 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  automation:
    # Automation engine (Layer 1: typed rules). Separate process for fault
    # isolation — a misbehaving rule can't stall state projection, and a
    # per-rule circuit breaker disables one that keeps erroring.
    build:
      context: .
      dockerfile: services/automation/Dockerfile
    image: dida/automation:latest
    container_name: dida-automation
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    environment:
      <<: [*dida-env, *dida-pg]
    volumes:
      - ${DIDA_STATE_HOST}/automation:/state
      - type: volume
        source: dida-keys
        target: /run/dida-db
        read_only: true
        volume:
          subpath: db-dida_app
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: core
    depends_on:
      keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_automation 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  journal:
    # Event journal — durable sink for discrete device events (dida.journal ->
    # ClickHouse device_events). Its own process on purpose: if it dies the house
    # doesn't notice (events queue in JetStream), and the engine keeps its single
    # responsibility instead of growing a second one.
    build:
      context: .
      dockerfile: services/journal/Dockerfile
    image: dida/journal:latest
    container_name: dida-journal
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    environment:
      <<: *dida-env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-dida}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dida}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ${DIDA_STATE_HOST}/journal:/state
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: core
    depends_on:
      keys:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      clickhouse:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_journal 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  netmgr:
    # Network manager — gives DIDA a presence on the IoT VLAN(s) WITHOUT touching
    # the host network. For each UI-selected VLAN it asks Docker (via the socket)
    # to create a macvlan network trunked to <parent>.<vlan> — Docker creates +
    # removes that tagging sub-link itself; the host's parent NIC, IP and routing
    # are never touched and nothing is written to netplan. netmgr connects itself
    # to the network and DHCPs on it, so the address comes from the router
    # (the router stays the sole owner of DHCP/firewall/routing). Desired VLANs live
    # in app_settings.managed_vlans (from the UI); none configured → idle.
    build:
      context: .
      dockerfile: services/netmgr/Dockerfile
    image: dida/netmgr:latest
    container_name: dida-netmgr
    security_opt:
      - "no-new-privileges:true"
    # PID-1 reaper: `dhclient … -nw` daemonizes and reparents to PID 1 (our Python
    # process, which never reaps) → zombies. tini reaps them.
    init: true
    <<: *dida-logging
    cap_add:
      - NET_ADMIN   # bring the macvlan iface up in our netns
      - NET_RAW     # dhclient raw socket
    environment:
      <<: [*dida-env, *dida-pg]
      POSTGRES_USER: dida_netmgr
      DIDA_NETMGR_CONTAINER: dida-netmgr
      DOCKER_SOCK: /docker/docker.sock
    volumes:
      - docker_api_netmgr:/docker
      - type: volume
        source: dida-keys
        target: /run/dida-db
        read_only: true
        volume:
          subpath: db-dida_netmgr
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: netmgr
    depends_on:
      docker-proxy-netmgr:
        condition: service_started
      keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_netmgr 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # Docker API for netmgr and govee, one proxy per consumer. Each exposes a filtered
  # unix socket in a volume mounted only into its consumer and has no network at
  # all, so no other container (bridge or host-net) can reach it; the allow-lists
  # name the exact calls, since container create/exec through a Docker API is root
  # on the host.
  docker-proxy-netmgr:
    <<: *docker-proxy
    container_name: dida-docker-proxy-netmgr
    command:
      - -proxysocketendpoint=/proxy/docker.sock
      - -proxysocketendpointfilemode=0600
      - -watchdoginterval=60
      - -stoponwatchdog
      - -allowGET=(/v1\.[0-9]+)?/containers/dida-[a-z0-9-]+/json
      - -allowPOST=(/v1\.[0-9]+)?/networks/(create|dida-vlan[0-9]+/(connect|disconnect))
      - -allowDELETE=(/v1\.[0-9]+)?/networks/dida-vlan[0-9]+
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker_api_netmgr:/proxy

  docker-proxy-govee:
    <<: *docker-proxy
    container_name: dida-docker-proxy-govee
    profiles: ["govee"]
    command:
      - -proxysocketendpoint=/proxy/docker.sock
      - -proxysocketendpointfilemode=0666
      - -watchdoginterval=60
      - -stoponwatchdog
      - -allowPOST=(/v1\.[0-9]+)?/containers/dida-govee2mqtt/restart
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker_api_govee:/proxy

  runner:
    # Switches this installation's adapters on and off from the UI. Every adapter is
    # its own compose profile; the runner is the only writer of COMPOSE_PROFILES in
    # .env and the only container holding the Docker socket, so the api — which is
    # published to the internet through the tunnel — never gets root-equivalent
    # access to the host. It talks compose (standalone binary, no docker CLI).
    build:
      context: .
      dockerfile: services/runner/Dockerfile
    image: dida/runner:latest
    container_name: dida-runner
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    environment:
      <<: *dida-env
      DIDA_REPO_HOST: ${DIDA_REPO_HOST:-/mnt/docker/dida}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The project itself, at the SAME absolute path as on the host: compose derives
      # the host paths it hands the daemon from this directory, so mounting it
      # anywhere else would point every relative bind mount at a path the host
      # doesn't have.
      - ${DIDA_REPO_HOST:-/mnt/docker/dida}:${DIDA_REPO_HOST:-/mnt/docker/dida}
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: core
    depends_on:
      keys:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_runner 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  lanprobe:
    # Host self-probe — reports every interface the host addressed (address/MAC,
    # which one is the LAN, which carries the default route) and its name: the
    # read-only counterpart to netmgr's VLAN presence. Must run host-networked —
    # only the host netns sees the real LAN interface (the bridge netns, where the
    # API/netmgr live, only ever sees the 172.x bridge address). Reuses the netmgr
    # image (same package, different entrypoint); no router integration — DIDA
    # knows itself on any network. Publishes app_settings.lan_status.
    image: dida/netmgr:latest
    container_name: dida-lanprobe
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    command: ["python", "-m", "dida_netmgr.lanprobe"]
    network_mode: host
    environment:
      <<: [*dida-env, *dida-pg]
      # host networking → reach the DB via the host-published loopback port.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${DIDA_PG_HOST_PORT:-5442}
      POSTGRES_USER: dida_lanprobe
    volumes:
      # The host's name (as the router registers it), read-only. host-net shares
      # the net namespace but NOT UTS, so this is how we read the real host name.
      - /etc/hostname:/host/etc/hostname:ro
      - type: volume
        source: dida-keys
        target: /run/dida-db
        read_only: true
        volume:
          subpath: db-dida_lanprobe
    depends_on:
      keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_lanprobe 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: dida/api:latest
    container_name: dida-api
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    environment:
      <<: [*dida-env, *dida-pg]
      DIDA_API_PORT: ${DIDA_API_PORT:-8090}
      DIDA_CORS_ORIGINS: ${DIDA_CORS_ORIGINS:-}
      # THIS host's address on the LAN the AV devices are on — what the SSDP
      # adapters bind discovery to and the cast panel URL names.
      # SEED ONLY: the api copies these into app_settings on first boot and nothing
      # reads them again — Settings → Network owns them from then on. Still required
      # here so a fresh install starts with a LAN address instead of none.
      DIDA_LAN_IP: ${DIDA_LAN_IP:?set in .env — THIS host's LAN IP as the devices reach it, e.g. 198.51.100.100}
      # OPUS · Player: where the house's music, radio and the bytes come from, as
      # the devices reach it, and the household's service token. Seeds like the
      # rest; empty = the media page has no shelf until Settings → Network says.
      DIDA_OPUS_URL: ${DIDA_OPUS_URL:-}
      DIDA_OPUS_TOKEN: ${DIDA_OPUS_TOKEN:-}
      # planvision (floor-plan vectorizer) — reached over the bridge net.
      DIDA_PLANVISION_URL: ${DIDA_PLANVISION_URL:-http://planvision:8094}
      # For the Zigbee console link on the Adapters page — the same value the
      # zigbee2mqtt service publishes on, read here rather than copied into the UI.
      DIDA_Z2M_PORT: ${DIDA_Z2M_PORT:-8092}
      # DIDA_PUBLIC_URL is the origin the outside world reaches (OAuth callbacks,
      # the app link); DIDA_APP_URL is the user's normal origin to land back on
      # (logged in).
      DIDA_PUBLIC_URL: ${DIDA_PUBLIC_URL:-http://[::1]:5273}
      DIDA_APP_URL: ${DIDA_APP_URL:-http://localhost:5273}
      # Seeded into app_settings on first boot like the rest; netmgr reads the stored
      # value, so this has to reach the SEEDER (here) — not the service that uses it.
      DIDA_NET_PARENT: ${DIDA_NET_PARENT:-}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-dida}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dida}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      # Auth. Secret persists under /state if DIDA_SECRET_KEY is unset. Cookie
      # Secure stays false so one cookie works over LAN HTTP + tunnel HTTPS.
      DIDA_SECRET_KEY: ${DIDA_SECRET_KEY:-}
      DIDA_COOKIE_SECURE: ${DIDA_COOKIE_SECURE:-false}
      # Trusted reverse-proxy IPs whose X-Forwarded-For the rate-limiter honours
      # (empty → trust internal/loopback hops: the vite proxy + cloudflared).
      DIDA_TRUSTED_PROXIES: ${DIDA_TRUSTED_PROXIES:-}
      DIDA_ADMIN_USERNAME: ${DIDA_ADMIN_USERNAME:-}
      DIDA_ADMIN_PASSWORD: ${DIDA_ADMIN_PASSWORD:-}
      # Observability: unset → /metrics is 404 (disabled). Set a token to enable
      # Prometheus scraping (?token= or Authorization: Bearer). /system/stats is
      # always available to a signed-in user.
      DIDA_METRICS_TOKEN: ${DIDA_METRICS_TOKEN:-}
      # Claude assistant (natural-language control). Unset → /assistant 503s.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # App revision stamp (GET /version). Git-derived by the push hook, mounted
      # read-only below and read per-request so a push refreshes it live.
      DIDA_REVISION_FILE: /app/revision.json
    # Loopback only — the browser reaches the API through the UI's internal vite
    # /api proxy over the Docker network (api:8090), never via this host port.
    ports:
      - "127.0.0.1:${DIDA_API_PORT:-8090}:${DIDA_API_PORT:-8090}"
    volumes:
      # Persist the JWT secret-key + bootstrap_admin_password across restarts.
      - ${DIDA_STATE_HOST}/api:/state
      - androidtv_snap:/snap
      # Scheduled backups land here (config .dump + history .tar.gz). Default is a
      # dir on the logs volume — SEPARATE from /state where the DB lives — so a
      # backup isn't on the same directory as the data. Point DIDA_BACKUP_HOST at an
      # NFS/off-box mount for real durability.
      - ${DIDA_BACKUP_HOST}:/backups
      # App revision stamp (git-derived; scripts/gen-revision.sh). Read-only,
      # re-read per request so a push updates /version without an API rebuild.
      - ./revision.json:/app/revision.json:ro
      # Android companion APK (android/build.sh on dev; deploy ships it to prod).
      # Served at /app/dida.apk + /app/apk.json — bind mount, no image rebuild.
      - ./android/dist:/apk:ro
      # The Zigbee console's own config, READ-ONLY and one file: the admin needs its
      # auth token to open the console, and the token lives here and nowhere else.
      # Copying it into app_settings would make a second place to rotate and forget.
      - ${DIDA_STATE_HOST}/zigbee2mqtt/configuration.yaml:/z2m/configuration.yaml:ro
      - type: volume
        source: dida-keys
        target: /run/dida-db
        read_only: true
        volume:
          subpath: db-dida_app
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: core
    depends_on:
      keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      clickhouse:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(f\"http://127.0.0.1:${DIDA_API_PORT:-8090}/healthz\", timeout=3).read() else 1)' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  ui:
    # The browser talks only to the UI; /api/* is proxied to the FastAPI service
    # (REST + WebSocket + camera streams share an origin, no CORS dance).
    #   DIDA_UI_TARGET=prod (default) → real vite build (adapter-node) served by
    #                                   ui/server.js, which does the /api proxy.
    #   DIDA_UI_TARGET=dev            → Vite dev server + HMR (bind-mounted src).
    # An installation is a production one unless it says otherwise, so `dev` is
    # what the one development box opts into — not what everyone else inherits.
    build:
      context: .
      dockerfile: ui/Dockerfile
      target: ${DIDA_UI_TARGET:-prod}
      args:
        # set in the prod .env to restore the "open in BABA" link
        VITE_BABA_URL: ${DIDA_BABA_URL:-}
    image: dida/ui:${DIDA_UI_TARGET:-prod}
    container_name: dida-ui
    security_opt:
      - "no-new-privileges:true"
    <<: *dida-logging
    environment:
      # Follow DIDA_API_PORT so the proxy target never pins a stale port. Read by
      # both vite.config.ts (dev) and server.js (prod).
      DIDA_API_URL: http://api:${DIDA_API_PORT:-8090}
      # The Vite dev server accepts only the hosts named here (plus IPs/localhost).
      DIDA_PUBLIC_URL: ${DIDA_PUBLIC_URL:-}
      DIDA_CORS_ORIGINS: ${DIDA_CORS_ORIGINS:-}
    # LAN-exposed (like BABA web) so it's reachable from a workstation at
    # http://<host>:${DIDA_UI_PORT}. The API/NATS/MQTT stay loopback — the
    # browser reaches the API through this UI's internal /api proxy over the
    # Docker network (service name api:8090), not via a host port. Both stages
    # listen on 5173 (server.js honours PORT, defaulting to it).
    ports:
      - "${DIDA_UI_PORT:-5273}:5173"
    # Dev: bind-mount source from the host so Vite HMR sees edits live (BABA's
    # web pattern). node_modules and .svelte-kit stay in the image — their
    # native bindings are built in-container, so the host must NOT shadow them.
    # In the prod stage these mounts are inert: server.js serves the baked
    # ./build, never ./src, so they overlay unused (identical) files.
    volumes:
      - ./ui/src:/app/src
      - ./ui/static:/app/static
      - ./ui/svelte.config.js:/app/svelte.config.js
      - ./ui/vite.config.ts:/app/vite.config.ts
      - ./ui/tsconfig.json:/app/tsconfig.json
      - ./ui/package.json:/app/package.json
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      # vite dev serves the app on 5173 in-container. node is always present;
      # avoid a wget/curl dependency the slim node image may not carry.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5173/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  adapter-mqtt:
    build:
      context: .
      dockerfile: adapters/mqtt/Dockerfile
    image: dida/adapter-mqtt:latest
    container_name: dida-adapter-mqtt
    security_opt:
      - "no-new-privileges:true"
    profiles: ["mqtt"]
    <<: *dida-logging
    environment:
      <<: *dida-env
    volumes:
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: mqtt
    depends_on:
      keys:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      nats:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_adapter-mqtt 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  adapter-denon:
    # Denon/Marantz AV receiver control via the native Telnet protocol (port 23):
    # power, master volume, mute and input source, per zone (Main + Zone2). The
    # socket is event-driven, so state is push. Host networking for SSDP
    # discovery; set DIDA_DENON_HOST to pin the receiver IP and skip discovery.
    build:
      context: .
      dockerfile: adapters/denon/Dockerfile
    image: dida/adapter-denon:latest
    container_name: dida-adapter-denon
    security_opt:
      - "no-new-privileges:true"
    profiles: ["denon"]
    <<: *dida-logging
    network_mode: host
    environment:
      <<: *dida-env
      DIDA_NATS_URL: nats://127.0.0.1:4232
      # Names the LAN leg SSDP binds to (local_ip() reads the host out of it) — this
      # host routes by default over the IoT VLAN, where no renderer lives.
    volumes:
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: denon
    depends_on:
      keys:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_adapter-denon 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  adapter-heos:
    # Denon/Marantz players via the HEOS CLI (TCP 1255) — the real control plane
    # for volume/transport/sources (their UPnP RenderingControl is a no-op, so
    # the DLNA adapter skips them). Host networking for SSDP discovery; one
    # connected device enumerates the whole HEOS system. Set DIDA_HEOS_HOST to
    # pin a device and skip discovery. NATS via the published loopback port.
    build:
      context: .
      dockerfile: adapters/heos/Dockerfile
    image: dida/adapter-heos:latest
    container_name: dida-adapter-heos
    security_opt:
      - "no-new-privileges:true"
    profiles: ["heos"]
    <<: *dida-logging
    network_mode: host
    environment:
      # Names the LAN leg SSDP binds to (local_ip() reads the host out of it) — this
      # host routes by default over the IoT VLAN, where no renderer lives.
      <<: *dida-env
      DIDA_NATS_URL: nats://127.0.0.1:4232
    volumes:
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: heos
    depends_on:
      keys:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_adapter-heos 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  adapter-baba:
    # BABA (vision/NVR) → DIDA. Two planes: (1) subscribes BABA's OWN NATS
    # (nats://127.0.0.1:4222 — a separate server from DIDA's, both loopback-
    # published on this shared host) for semantic events, translating them into
    # motion/occupancy/person_count/object_class/scene_state; (2) enumerates
    # go2rtc streams and registers each camera as an entity with a stream
    # descriptor (the UI pulls WebRTC/HLS straight from go2rtc — pixels never
    # touch the bus). Host networking so it reaches BOTH NATS servers (DIDA via
    # the published :4232, BABA via :4222) and go2rtc over loopback. Read-only.
    build:
      context: .
      dockerfile: adapters/baba/Dockerfile
    image: dida/adapter-baba:latest
    container_name: dida-adapter-baba
    security_opt:
      - "no-new-privileges:true"
    profiles: ["baba"]
    <<: *dida-logging
    network_mode: host
    environment:
      <<: *dida-env
      DIDA_NATS_URL: nats://127.0.0.1:4232
    volumes:
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: baba
    depends_on:
      keys:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_adapter-baba 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  adapter-frigate:
    # Frigate NVRs at OTHER locations → DIDA. One adapter, many sites (Coast,
    # Island, …), each configured in Settings → Adapters. The vision sibling of
    # adapter-baba (home) but off-site: per site it reads the camera roster over
    # HTTP (registering each camera as a `frigate:<cam>` entity with a `site`
    # label) and, for a LOCAL Frigate that declares a broker, consumes its MQTT
    # topics (events/objects/zones/motion/feature switches). Plain bridged egress
    # (NOT host net like baba): it dials OUT to each site's HTTP/broker and reaches
    # DIDA's nats + postgres by service name. Read-only except the per-camera
    # feature switches. Idle until a location is configured.
    build:
      context: .
      dockerfile: adapters/frigate/Dockerfile
    image: dida/adapter-frigate:latest
    container_name: dida-adapter-frigate
    security_opt:
      - "no-new-privileges:true"
    profiles: ["frigate"]
    <<: *dida-logging
    environment:
      <<: *dida-env
    volumes:
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: frigate
    depends_on:
      keys:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_adapter-frigate 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  adapter-cast:
    # Google Cast (Chromecast / Android TV / Nest) via pychromecast. Each Cast
    # device becomes a media-player entity (now-playing + transport + volume).
    # Host networking for mDNS discovery + the per-device CASTV2 sockets.
    build:
      context: .
      dockerfile: adapters/cast/Dockerfile
    image: dida/adapter-cast:latest
    container_name: dida-adapter-cast
    security_opt:
      - "no-new-privileges:true"
    profiles: ["cast"]
    <<: *dida-logging
    network_mode: host
    environment:
      # Host-net → reach Postgres (for wall-panel config + token) via the
      # published loopback port. The /panel cast URL is built LAN-local — the Hub
      # is on the same switch, so its page, camera MJPEG and photo slideshow have
      # no business round-tripping through the public tunnel — from the host's
      # declared LAN leg (lan_ip) plus the published UI port. DIDA_APP_URL
      # remains the fallback for a host that declares no LAN leg.
      <<: *dida-env
      DIDA_NATS_URL: nats://127.0.0.1:4232
      DIDA_UI_PORT: ${DIDA_UI_PORT:-5273}
    volumes:
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: cast
    depends_on:
      keys:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_adapter-cast 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  adapter-dlna:
    # Discovers DLNA/UPnP MediaRenderers (TVs, AV receivers, the iFi Zen Stream)
    # via SSDP and drives them as media-player entities. Needs host networking:
    # SSDP discovery is LAN multicast (doesn't cross the docker bridge), and it
    # future-proofs GENA event callbacks (renderer → us). Because it shares the
    # host net namespace, NATS is reached at the published loopback port, not the
    # `nats` service DNS name.
    build:
      context: .
      dockerfile: adapters/dlna/Dockerfile
    image: dida/adapter-dlna:latest
    container_name: dida-adapter-dlna
    security_opt:
      - "no-new-privileges:true"
    profiles: ["dlna"]
    <<: *dida-logging
    network_mode: host
    environment:
      <<: *dida-env
      DIDA_NATS_URL: nats://127.0.0.1:4232
      # SSDP binds to the host's declared LAN leg (lan_ip, read by local_ip()):
      # this host routes by default over the IoT VLAN, where no renderer lives.
    volumes:
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: dlna
    depends_on:
      keys:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_adapter-dlna 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  adapter-volumio:
    # iFi Zen Stream via its NATIVE Volumio REST API (state, control, cast, config)
    # — replaces the generic DLNA path for that one device (dlna excludes it). Bridge
    # net: reaches the Zen and NATS/Postgres by name, no SSDP.
    build:
      context: .
      dockerfile: adapters/volumio/Dockerfile
    image: dida/adapter-volumio:latest
    container_name: dida-adapter-volumio
    security_opt:
      - "no-new-privileges:true"
    profiles: ["volumio"]
    <<: *dida-logging
    environment:
      <<: *dida-env
    volumes:
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: volumio
    depends_on:
      keys:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_adapter-volumio 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  adapter-androidtv:
    # NVIDIA Shield / any Android TV / Google TV box via the Android TV Remote v2
    # protocol (power, D-pad nav, app launch, media keys, volume). Bridge net:
    # reaches the box on the LAN and NATS/Postgres by name. Added by PAIRING (the
    # TV shows a 6-digit code) — the cert lives encrypted in adapter_config.
    build:
      context: .
      dockerfile: adapters/androidtv/Dockerfile
    image: dida/adapter-androidtv:latest
    container_name: dida-adapter-androidtv
    security_opt:
      - "no-new-privileges:true"
    profiles: ["androidtv"]
    <<: *dida-logging
    environment:
      <<: *dida-env
    volumes:
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: androidtv
      - androidtv_snap:/snap
    depends_on:
      keys:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_adapter-androidtv 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  adapter-opus:
    # The OPUS TV screen as a media player: reads what OPUS · Player says the
    # television is doing and hands the house's orders to the player's mailbox
    # for it — never a second connection to the box. Where the player answers and
    # its token are Settings → Network (opus_url / opus_token), not config here.
    build:
      context: .
      dockerfile: adapters/opus/Dockerfile
    image: dida/adapter-opus:latest
    container_name: dida-adapter-opus
    security_opt:
      - "no-new-privileges:true"
    profiles: ["opus"]
