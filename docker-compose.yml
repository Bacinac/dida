  adapter-cloudflare:
    # Edits the ingress this installation carries, from the UI. Which one that is
    # depends on what is mounted below:
    #   services.conf  — the house: one source that also drives Caddy (LAN), the
    #     router's split-DNS and Homepage. The adapter does NOT apply it; a systemd
    #     path unit on the Proxmox host runs apply-ingress.sh, the only place all of
    #     those can be reached.
    #   config.yml     — an installation where DIDA owns the tunnel outright: the
    #     connectors' own config IS the ingress, so the adapter renders it and asks
    #     the runner to roll the connectors (it holds the docker socket, we do not).
    # Plain bridge networking: it needs NATS + Postgres, nothing else.
    build:
      context: .
      dockerfile: adapters/cloudflare/Dockerfile
    image: dida/adapter-cloudflare:latest
    container_name: dida-adapter-cloudflare
    security_opt:
      - "no-new-privileges:true"
    profiles: ["cloudflare"]
    <<: *dida-logging
    environment:
      <<: *dida-env
    volumes:
      - type: volume
        source: dida-keys
        target: /run/dida-key
        read_only: true
        volume:
          subpath: cloudflare
      # The ingress source, bind-mounted through from /mnt/docker/main/ingress on the
      # host. Read-write: the UI edits it, and the host applies what it reads back.
      # Absent (an empty dir) on an installation that has no host applier.
      - ${DIDA_STATE_HOST}/ingress:/ingress
      # The connectors' own config — the ingress itself where there is no applier.
      # The same directory cloudflared reads, so there is one file, not a copy.
      - ${DIDA_STATE_HOST}/cloudflared:/cloudflared
    depends_on:
      keys:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/dida_healthy_adapter-cloudflare 2>/dev/null || echo 0) )) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # The Cloudflare tunnel itself — co-located with DIDA so the adapter owns and
  # restarts it locally (over the Docker socket). Host networking: it must reach
  # every origin service across the LAN + VLANs (this host routes to all of them).
  # config.yml, credentials.json and cert.pem belong to this installation, so they
  # sit in its own state dir. Anything else (a dir on a retired host's dataset) makes
  # the tunnel outlive-dependent on a box DIDA no longer owns. The connectors run as
  # the uid that writes that dir (adapter-cloudflare), because the credentials a
  # created tunnel gets are 0600.
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    container_name: dida-cloudflared
    user: "1000:1000"
    security_opt:
      - "no-new-privileges:true"
    # Its OWN profile, apart from the adapter's. The adapter is a control plane
    # and is useful wherever routes are edited; a connector is a data plane and
    # only makes sense where this installation actually terminates the tunnel.
    # Sharing one profile meant an install that wanted the former got the latter
    # too, and with no credentials on disk both connectors crash-looped forever
    # (measured on the dev box: 4429 restarts, drowning its logs).
    profiles: ["cloudflare-tunnel"]
    network_mode: host
    command: tunnel --protocol http2 --config /etc/cloudflared/config.yml run
    volumes:
      - ${DIDA_STATE_HOST}/cloudflared:/etc/cloudflared:ro
    <<: *dida-logging
    restart: always

  # Second connector on the SAME tunnel — Cloudflare balances across both, so the
  # adapter can rolling-restart them (one at a time) to apply a config change with
  # no user-visible outage (the other keeps serving during each restart).
  cloudflared-2:
    image: cloudflare/cloudflared:2026.7.3
    container_name: dida-cloudflared-2
    user: "1000:1000"
    security_opt:
      - "no-new-privileges:true"
    profiles: ["cloudflare-tunnel"]
    network_mode: host
    command: tunnel --protocol http2 --config /etc/cloudflared/config.yml run
    volumes:
      - ${DIDA_STATE_HOST}/cloudflared:/etc/cloudflared:ro
    <<: *dida-logging
    restart: always

