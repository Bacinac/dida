# Local MQTT broker for DIDA. Auth required: clients (adapter-mqtt,
# adapter-presence, zigbee2mqtt) authenticate with the `dida` user whose hashed
# credential lives in the mounted password_file. Anonymous access is off so a
# host-local process can't forge device state onto the bus.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
