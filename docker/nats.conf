# NATS server config for DIDA.
# JetStream on (bus persistence + backpressure). HTTP monitor bound to
# loopback only — used by the compose healthcheck, not exposed off-box.

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 4GB
}

http: "127.0.0.1:8222"

# One login per bus identity, written by the keys service from DIDA_SECRET_KEY:
# `core` (engine, api, automation, journal, runner) may do anything; each adapter,
# the Matter bridge and netmgr publish only under their own name and hear only
# what is addressed to them. The bus is a NETWORK service (unlike Home Assistant's
# in-process trust), so what an adapter — the most exposed process in the house —
# may do is the server's decision, not the adapter's. The table is
# dida_core.identity; the NATS log names any subject a client is refused.
include "auth/users.conf"
