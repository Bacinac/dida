[project]
name = "dida-automation"
version = "0.1.0"
description = "DIDA automation engine (Layer 1 typed rules + Layer 2 Starlark sandbox)"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "asyncpg>=0.30",
    "starlark-pyo3>=2025",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_automation"]
