[project]
name = "dida-engine"
version = "0.1.0"
description = "DIDA state engine: validate -> project -> persist"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "asyncpg>=0.30",
    "clickhouse-connect[async]>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_engine"]
