[project]
name = "dida-journal"
version = "0.1.0"
description = "DIDA journal: durable sink for discrete device events"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "clickhouse-connect[async]>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_journal"]
