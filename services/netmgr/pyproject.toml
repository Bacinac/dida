[project]
name = "dida-netmgr"
version = "0.1.0"
description = "DIDA network manager — brings up VLAN sub-interfaces (DHCP) so DIDA is present on the IoT VLAN(s)"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
    "asyncpg",
    "aiohttp>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_netmgr"]
