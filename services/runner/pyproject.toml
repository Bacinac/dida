[project]
name = "dida-runner"
version = "0.1.0"
description = "DIDA runner — turns an installation's adapters on and off by driving compose profiles"
requires-python = ">=3.14"
dependencies = [
    "dida-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida_runner"]
